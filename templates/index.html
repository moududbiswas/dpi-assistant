<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DPI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" style="border-radius: 2px ;" href="/static/image/WhatsApp Image 2026-05-13 at 3.29.25 PM.jpeg" type="image/x-icon">
    <style>
        :root {
            --navy:     #1a2f8a;
            --navy-d:   #0f1d5e;
            --navy-l:   #2a45b8;
            --blue-mid: #3b5bdb;
            --sky:      #dde4f5;
            --sky-d:    #c8d2ee;
            --red:      #c0392b;
            --cyan:     #00b4d8;
            --white:    #ffffff;
            --off-white:#e8ecf6;
            --bg-main:  #e4e9f5;
            --header-bg:#ffffff;
            --text:     #0d1b5e;
            --text-mid: #3d4f9f;
            --text-muted:#8fa0cc;
            --border:   rgba(26,47,138,0.10);
            --border-h: rgba(26,47,138,0.28);
            --shadow-sm:0 2px 8px rgba(26,47,138,0.08);
            --shadow:   0 6px 24px rgba(26,47,138,0.10);
            --shadow-lg:0 12px 40px rgba(26,47,138,0.14);
            --user-bg:  #1a2f8a;
            --ai-bg:    #ffffff;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg-main);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(26,47,138,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(26,47,138,0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -80px;
            right: -80px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(26,47,138,0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ── */
        header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            box-shadow: 0 1px 0 var(--border), 0 2px 12px rgba(26,47,138,0.07);
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--navy-d), var(--navy-l), var(--cyan));
        }

        .logo-wrap {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 3px;
            overflow: hidden;
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .header-text h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: 2px;
        }
        .header-text p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
            letter-spacing: 0.3px;
        }

        .status-pill {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: var(--text-mid);
            font-weight: 500;
            padding: 5px 12px;
            background: var(--off-white);
            border-radius: 20px;
            border: 1px solid var(--border);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .status-dot-circle {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2.5s ease-in-out infinite;
            box-shadow: 0 0 6px #4ade80;
            flex-shrink: 0;
        }
        @keyframes pulse {
            0%,100% { opacity:1; transform:scale(1); }
            50%      { opacity:0.5; transform:scale(0.7); }
        }

        /* ── CHAT BOX ── */
        #chatbox {
            flex: 1;
            overflow-y: auto;
            padding: 28px 20px;
            position: relative;
            z-index: 1;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-main);
        }
        #chatbox::-webkit-scrollbar { width: 5px; }
        #chatbox::-webkit-scrollbar-track { background: transparent; }
        #chatbox::-webkit-scrollbar-thumb { background: var(--sky-d); border-radius: 10px; }

        /* ── WELCOME ── */
        .welcome {
            text-align: center;
            padding: 32px 20px 24px;
            animation: fadeUp 0.7s cubic-bezier(0.2,0.8,0.2,1) forwards;
            max-width: 480px;
            width: 100%;
        }
        .welcome-logo {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: white;
            padding: 6px;
            box-shadow: var(--shadow-lg);
            border: 2.5px solid rgba(26,47,138,0.18);
            animation: float 5s ease-in-out infinite;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .welcome-logo img { width:100%; height:100%; object-fit:contain; display:block; }
        @keyframes float {
            0%,100% { transform:translateY(0); }
            50%      { transform:translateY(-10px); }
        }
        .welcome h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .welcome p {
            color: var(--text-mid);
            font-size: 14.5px;
            line-height: 1.75;
            margin-bottom: 28px;
        }

        .quick-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .quick-btn {
            padding: 9px 18px;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 22px;
            color: var(--text-mid);
            font-size: 13px;
            font-weight: 500;
            font-family: 'Hind Siliguri', sans-serif;
            cursor: pointer;
            transition: all 0.22s ease;
            box-shadow: 0 2px 6px rgba(26,47,138,0.07);
        }
        .quick-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
            background: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        /* ── MESSAGES ── */
        .msg-row {
            display: flex;
            margin-bottom: 20px;
            animation: fadeUp 0.35s cubic-bezier(0.2,0.8,0.2,1) forwards;
            gap: 10px;
            width: 100%;
            max-width: 720px;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(14px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .msg-row.user { flex-direction: row-reverse; }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            margin-top: 4px;
            overflow: hidden;
        }
        .avatar.ai {
            background: white;
            border: 2px solid var(--navy);
            padding: 3px;
            box-shadow: var(--shadow-sm);
        }
        .avatar.ai img { width:100%; height:100%; object-fit:contain; }
        .avatar.user {
            background: linear-gradient(135deg, var(--navy), var(--blue-mid));
            color: white;
            font-size: 16px;
            box-shadow: var(--shadow-sm);
        }

        .bubble {
            max-width: 72%;
            padding: 13px 18px;
            border-radius: 20px;
            font-size: 14.5px;
            line-height: 1.75;
            position: relative;
        }
        .bubble.ai {
            background: var(--white);
            border: 1.5px solid var(--border);
            border-top-left-radius: 4px;
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }
        .bubble.user {
            background: var(--navy);
            border: none;
            border-top-right-radius: 4px;
            color: white;
            box-shadow: var(--shadow);
        }

        /* ── TYPING INDICATOR ── */
        .typing-bubble {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            border-top-left-radius: 4px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-sm);
        }
        .typing-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(1) { background: var(--navy);    animation-delay: 0s; }
        .typing-dot:nth-child(2) { background: var(--red);     animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { background: var(--cyan);    animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%,60%,100% { transform:translateY(0); opacity:0.4; }
            30%         { transform:translateY(-7px); opacity:1; }
        }
        .typing-label {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 0.2px;
        }

        /* ── SOUNDBAR ANIMATION ── */
        .soundbar {
            display: inline-flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 18px;
            margin-left: 10px;
            vertical-align: middle;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .soundbar.playing {
            opacity: 1;
        }
        .soundbar-bar {
            width: 3px;
            border-radius: 2px;
            animation: none;
            height: 4px;
            transition: height 0.1s ease;
        }
        .soundbar-bar:nth-child(1) { background: var(--navy); }
        .soundbar-bar:nth-child(2) { background: var(--cyan); }
        .soundbar-bar:nth-child(3) { background: var(--navy-l); }
        .soundbar-bar:nth-child(4) { background: var(--cyan); }
        .soundbar-bar:nth-child(5) { background: var(--navy); }

        .soundbar.playing .soundbar-bar:nth-child(1) {
            animation: bar-dance 0.9s ease-in-out infinite;
            animation-delay: 0s;
        }
        .soundbar.playing .soundbar-bar:nth-child(2) {
            animation: bar-dance 0.7s ease-in-out infinite;
            animation-delay: 0.15s;
        }
        .soundbar.playing .soundbar-bar:nth-child(3) {
            animation: bar-dance 1.1s ease-in-out infinite;
            animation-delay: 0.05s;
        }
        .soundbar.playing .soundbar-bar:nth-child(4) {
            animation: bar-dance 0.8s ease-in-out infinite;
            animation-delay: 0.25s;
        }
        .soundbar.playing .soundbar-bar:nth-child(5) {
            animation: bar-dance 1.0s ease-in-out infinite;
            animation-delay: 0.1s;
        }

        @keyframes bar-dance {
            0%, 100% { height: 4px;  opacity: 0.5; }
            25%       { height: 14px; opacity: 1;   }
            50%       { height: 8px;  opacity: 0.8; }
            75%       { height: 16px; opacity: 1;   }
        }

        /* ── INPUT AREA ── */
        .input-area {
            position: relative;
            z-index: 10;
            padding: 12px 20px 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            background: var(--bg-main);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            width: 100%;
            max-width: 720px;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 12px 16px;
            transition: all 0.25s ease;
            box-shadow: var(--shadow);
        }
        .input-wrapper:focus-within {
            border-color: var(--navy-l);
            box-shadow: 0 0 0 3px rgba(26,47,138,0.07), var(--shadow);
        }
        #userInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 14.5px;
            font-family: 'Hind Siliguri', sans-serif;
            resize: none;
            max-height: 120px;
            line-height: 1.6;
            padding-top: 3px;
        }
        #userInput::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--navy);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.22s ease;
            box-shadow: 0 3px 10px rgba(26,47,138,0.3);
        }
        .send-btn:hover {
            background: var(--navy-l);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 16px rgba(26,47,138,0.35);
        }
        .send-btn:active { transform: scale(0.93); }
        .send-btn svg { width:18px; height:18px; fill:white; }

        .input-hint {
            text-align: center;
            font-size: 10.5px;
            color: var(--text-muted);
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        /* ── MOBILE ── */
        @media (max-width: 640px) {
            header { padding: 0 14px; height: 58px; }
            .header-text h1 { font-size: 15px; letter-spacing: 1.5px; }
            #chatbox { padding: 18px 12px; }
            .bubble { max-width: 83%; font-size: 14px; padding: 11px 15px; }
            .input-area { padding: 10px 12px calc(18px + env(safe-area-inset-bottom, 0px)); }
            .welcome h2 { font-size: 22px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-wrap">
        <img src="/static/image/WhatsApp Image 2026-05-13 at 3.29.25 PM.jpeg" alt="DPI Logo">
    </div>
    <div class="header-text">
        <h1>DPI ASSISTANT</h1>
        <p>ঢাকা পলিটেকনিক ইনস্টিটিউট · AI সহকারী</p>
    </div>
    <div class="status-pill">
        <div class="status-dot-circle"></div>
        <span id="statusText">অনলাইন</span>
    </div>
</header>

<div id="chatbox">
    <div class="welcome" id="welcome">
        <div class="welcome-logo">
            <img src="/static/image/WhatsApp Image 2026-05-13 at 3.29.25 PM.jpeg" alt="DPI Logo">
        </div>
        <h2>আস্সালামুয়ালাইকুম!</h2>
        <p>আমি DPI Assistant — ঢাকা পলিটেকনিক ইনস্টিটিউটের অফিশিয়াল AI সহকারী।<br>ক্লাস রুটিন, শিক্ষক তথ্য, নোটিশ — যেকোনো প্রশ্ন করুন।</p>
        <div class="quick-btns">
            <button class="quick-btn" onclick="quickAsk('আজকের ক্লাস রুটিন কী?')">📅 আজকের রুটিন</button>
            <button class="quick-btn" onclick="quickAsk('কোন কোন বিভাগ আছে?')">🏫 বিভাগসমূহ</button>
            <button class="quick-btn" onclick="quickAsk('অফিস সময় কখন?')">🕐 অফিস সময়</button>
            <button class="quick-btn" onclick="quickAsk('ভর্তির নিয়ম কী?')">📝 ভর্তি তথ্য</button>
        </div>
    </div>
</div>

<div class="input-area">
    <div class="input-wrapper">
        <textarea id="userInput" placeholder="আপনার প্রশ্ন লিখুন..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
    <div class="input-hint">Enter চাপুন বা বোতামে ক্লিক করুন · Shift+Enter নতুন লাইন</div>
</div>

<script>
    const LOGO_SRC = "/static/image/WhatsApp Image 2026-05-13 at 3.29.25 PM.jpeg";

    let history = [];
    let currentAudio = null;
    let currentSoundbar = null;

    const textarea = document.getElementById('userInput');
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function quickAsk(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    /* ── Build soundbar DOM ── */
    function buildSoundbar() {
        const bar = document.createElement('span');
        bar.className = 'soundbar';
        for (let i = 0; i < 5; i++) {
            const b = document.createElement('span');
            b.className = 'soundbar-bar';
            bar.appendChild(b);
        }
        return bar;
    }

    /* ── Play TTS for a reply, animate soundbar ── */
    async function speakReply(plainText, soundbarEl) {
        // Stop any currently playing audio
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        if (currentSoundbar) {
            currentSoundbar.classList.remove('playing');
            currentSoundbar = null;
        }

        try {
            const res = await fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: plainText })
            });

            if (!res.ok) return;

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            currentAudio = audio;
            currentSoundbar = soundbarEl;

            audio.addEventListener('play', () => {
                soundbarEl.classList.add('playing');
            });
            audio.addEventListener('ended', () => {
                soundbarEl.classList.remove('playing');
                URL.revokeObjectURL(url);
                currentAudio = null;
                currentSoundbar = null;
            });
            audio.addEventListener('pause', () => {
                soundbarEl.classList.remove('playing');
            });
            audio.addEventListener('error', () => {
                soundbarEl.classList.remove('playing');
                currentAudio = null;
                currentSoundbar = null;
            });

            await audio.play();
        } catch (e) {
            console.warn('TTS error:', e);
            if (soundbarEl) soundbarEl.classList.remove('playing');
        }
    }

    /* ── Strip HTML tags to get plain text for TTS ── */
    function stripHtml(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
    }

    function addMessage(content, role) {
        const welcome = document.getElementById('welcome');
        if (welcome) welcome.remove();

        const chatbox = document.getElementById('chatbox');
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;

        const avatar = document.createElement('div');
        avatar.className = 'avatar ' + role;
        if (role === 'ai') {
            avatar.innerHTML = '<img src="' + LOGO_SRC + '" alt="DPI">';
        } else {
            avatar.textContent = '🧑';
        }

        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + role;
        bubble.innerHTML = content;

        /* Add soundbar at the end of AI bubbles */
        let soundbarEl = null;
        if (role === 'ai') {
            soundbarEl = buildSoundbar();
            bubble.appendChild(soundbarEl);
        }

        row.appendChild(avatar);
        row.appendChild(bubble);
        chatbox.appendChild(row);
        chatbox.scrollTop = chatbox.scrollHeight;

        return { bubble, soundbarEl };
    }

    function addTyping() {
        const welcome = document.getElementById('welcome');
        if (welcome) welcome.remove();

        const chatbox = document.getElementById('chatbox');
        const row = document.createElement('div');
        row.className = 'msg-row ai';
        row.id = 'typing-row';

        const avatar = document.createElement('div');
        avatar.className = 'avatar ai';
        avatar.innerHTML = '<img src="' + LOGO_SRC + '" alt="DPI">';

        const bubble = document.createElement('div');
        bubble.className = 'typing-bubble';
        bubble.innerHTML = `
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
            <span class="typing-label">ভাবছি...</span>
        `;

        row.appendChild(avatar);
        row.appendChild(bubble);
        chatbox.appendChild(row);
        chatbox.scrollTop = chatbox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const message = input.value.trim();
        if (!message) return;

        input.value = '';
        input.style.height = 'auto';

        addMessage(message, 'user');
        addTyping();

        try {
            const res = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, history })
            });

            const data = await res.json();
            document.getElementById('typing-row')?.remove();

            const { soundbarEl } = addMessage(data.reply, 'ai');

            history.push({ role: 'user', content: message });
            history.push({ role: 'assistant', content: data.reply });

            /* Auto read aloud */
            if (soundbarEl) {
                const plainText = stripHtml(data.reply);
                speakReply(plainText, soundbarEl);
            }

        } catch (err) {
            document.getElementById('typing-row')?.remove();
            addMessage('⚠️ সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করুন।', 'ai');
        }
    }
</script>
